apiVersion: apps/v1
kind: Deployment
metadata:
  name: stgapp2
  labels:
    app: stgapp2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stgapp2
  template:
    metadata:
      labels:
        app: stgapp2
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
